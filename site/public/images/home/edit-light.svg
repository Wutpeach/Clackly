<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- Original Clackly light study: a curved edit aperture, not product UI. -->
  <defs>
    <linearGradient id="metal" x1="388" y1="705" x2="1220" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35363C" stop-opacity="0"/>
      <stop offset=".42" stop-color="#797C85" stop-opacity=".3"/>
      <stop offset=".7" stop-color="#B8BBC4" stop-opacity=".75"/>
      <stop offset=".88" stop-color="#F1F2F4"/>
      <stop offset="1" stop-color="#CACDD5" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="edge" x1="334" y1="738" x2="1300" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#737680" stop-opacity="0"/>
      <stop offset=".48" stop-color="#B1B5BE" stop-opacity=".35"/>
      <stop offset=".72" stop-color="#E7E8EA"/>
      <stop offset=".88" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5A8B2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="air" cx="0" cy="0" r="1" gradientTransform="translate(1090 315) rotate(146) scale(530 235)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9BCC5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A3A7B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="fade" x1="800" y1="80" x2="800" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity="0"/><stop offset=".13" stop-color="white"/><stop offset=".8" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="falloff"><path fill="url(#fade)" d="M0 0h1600v1000H0z"/></mask>
  </defs>
  <g mask="url(#falloff)">
    <path fill="url(#air)" d="M0 0h1600v1000H0z"/>
    <path d="M178 831C237 591 642 203 1057 163C1448 126 1438 405 1043 678" stroke="url(#metal)" stroke-width="55" filter="url(#bloom)"/>
    <path d="M178 831C237 591 642 203 1057 163C1448 126 1438 405 1043 678" stroke="url(#metal)" stroke-width="19" filter="url(#soft)"/>
    <path d="M178 831C237 591 642 203 1057 163C1448 126 1438 405 1043 678" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M269 860C335 631 698 295 1078 253C1401 218 1368 443 1082 641" stroke="url(#metal)" stroke-width="28" filter="url(#bloom)" opacity=".6"/>
    <path d="M269 860C335 631 698 295 1078 253C1401 218 1368 443 1082 641" stroke="url(#edge)" stroke-width="1" opacity=".3"/>
  </g>
