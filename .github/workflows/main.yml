name: Main Windows verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: resolve-command-center
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resolve-command-center/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - name: Verify isolated native-free installation transactions
        run: powershell -NoProfile -NonInteractive -File scripts/workflow-update/WorkflowTransaction.test.ps1 -Mode Focused
      - run: npm run build
      - name: Verify release tooling without publication
        run: npm run workflow:release:test
  workflow-package:
    name: Complete native-free Workflow ZIP
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: resolve-command-center
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resolve-command-center/package-lock.json
      - run: npm ci
      - run: npm run package:win
      - run: npm run package:verify
      - name: Build and verify the one complete development Workflow ZIP
        run: |
          node scripts/workflow-release/package.js --nonpublishable
          if ($LASTEXITCODE -ne 0) { throw 'Workflow package build failed' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/workflow-release/package.js --verify "release/workflow/Clackly-Workflow-$version-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Workflow ZIP verification failed' }
          Get-FileHash -Algorithm SHA256 -LiteralPath "release/workflow/Clackly-Workflow-$version-win-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-workflow-development-zip
          path: resolve-command-center/release/workflow/Clackly-Workflow-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
