name: Windows Inno draft release
on:
  push:
    tags: ['v*']
    branches: ['preflight/**']
permissions:
  contents: read
concurrency:
  group: workflow-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: resolve-command-center
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resolve-command-center/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Cache verified Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-v1-${{ hashFiles('resolve-command-center/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-v1-
      - name: Cache locked Python downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: resolve-command-center/build/runtime-cache
          key: ${{ runner.os }}-${{ runner.arch }}-python-v1-${{ hashFiles('resolve-command-center/resources/runtimes/*.lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-python-v1-
      - run: npm ci
      - name: Check clean source and exact tag for releases
        run: |
          node -e "const p=require('./package.json');const publishable=process.env.GITHUB_REF_TYPE==='tag';const s=require('./scripts/workflow-release/package').sourceIdentity(p.version,{publishable,tag:publishable?process.env.GITHUB_REF_NAME:undefined});if(s.dirty)throw Error('Build requires clean committed source')"
      - run: npm run workflow:release:test
      - name: Verify Inno source input and Settings EXE handoff
        run: node --test scripts/inno-setup/verify-input.test.js electron/main/update/identity.test.js electron/main/update/InstallCoordinator.test.js electron/main/update/install/InnoInstaller.test.js electron/main/update/UpdateService.test.js electron/main/update/network.test.js electron/main/update/registerIpc.test.js electron/renderer/updatePresentation.test.mjs
      - run: npm run package:win
      - run: npm run package:verify
      - name: Build complete intermediate Workflow ZIP
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/workflow-release/package.js --tag $env:GITHUB_REF_NAME
          } else {
            node scripts/workflow-release/package.js --nonpublishable
          }
          if ($LASTEXITCODE -ne 0) { throw 'Workflow ZIP build failed' }
      - name: Verify exact artifact bytes and record SHA-256
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/workflow-release/package.js --verify "release/workflow/Clackly-Workflow-$version-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Workflow ZIP verification failed' }
          Get-FileHash -Algorithm SHA256 -LiteralPath "release/workflow/Clackly-Workflow-$version-win-x64.zip"
      - name: Install pinned Inno compiler
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler installation failed' }
      - name: Build complete offline Inno EXE
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          npm run setup:build -- "release/workflow/Clackly-Workflow-$version-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Inno build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-inno-release
          path: resolve-command-center/release/setup/Clackly-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inno-build-evidence
          path: resolve-command-center/release/setup/build-report.json
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    # Remains disabled until separately authorized repository activation. Never publish automatically.
    if: startsWith(github.ref, 'refs/tags/') && vars.CLACKLY_ENABLE_DRAFT_RELEASE == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-inno-release
          path: artifact
      - name: Retain verified build identity and create an unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GH_REPO -cne 'Wutpeach/Clackly') { throw 'Unexpected publisher repository' }
          $files = @(Get-ChildItem -LiteralPath artifact -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one complete Inno EXE' }
          if ($files[0].Name -cne "Clackly-Setup-$($env:GITHUB_REF_NAME.Substring(1))-win-x64.exe") { throw 'Artifact name differs from exact release tag' }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          gh release create $env:GITHUB_REF_NAME $files[0].FullName --repo Wutpeach/Clackly --verify-tag --target $env:GITHUB_SHA --draft --title "Clackly $env:GITHUB_REF_NAME" --notes "Draft only. Unsigned Inno EXE SHA-256: $digest. Source commit: $env:GITHUB_SHA. Includes application and managed Runtime; official Native is validated locally during installation. Users on v0.1.3 or earlier: download and run this EXE manually once, then use the new Settings updater. Close Resolve yourself when prompted. Review unsigned publisher/SmartScreen risk before manual publication; verify the actual GitHub API asset digest and download after publication."
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
